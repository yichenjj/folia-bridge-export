<!doctype html><html><head><meta charset="utf-8"><title>Folia HUD</title><style>body{margin:0;background:#0a0c10;color:#cfe3ff;font:14px/1.7 Consolas,Menlo,monospace;padding:28px;min-height:100vh}.song{font-size:26px;font-weight:bold;color:#fff}.artist{color:#8fa3c8;margin:2px 0 18px}.clock{font-size:18px;margin-bottom:6px}.bar{height:5px;background:#1d2735;border-radius:3px;margin:10px 0 20px}.fill{height:5px;background:#8fd3ff;border-radius:3px}.line{font-size:20px;color:#fff;margin-top:26px;min-height:30px}.trans{font-size:15px;color:#9fb4d8;min-height:22px}.meta{font-size:12px;color:#5b6b85;margin-top:26px}.pill{display:inline-block;background:#16202e;border-radius:6px;padding:2px 10px;margin-right:8px}</style></head><body><div class="song" id="song">—</div><div class="artist" id="artist"></div><div class="clock" id="clock">--:-- / --:--</div><div class="bar"><div class="fill" id="fill" style="width:0%"></div></div><div><span class="pill" id="state">—</span><span class="pill" id="mode">—</span><span class="pill" id="hz"></span></div><div class="line" id="line"></div><div class="trans" id="trans"></div><div class="meta">Folia NCPlayer 独立窗口 · 关闭此页面不影响网易云 · 数据每 500ms 刷新</div><script>var BASE="http://localhost:60477/mounted_file/hXwn8Wd5nhkNtReGpQiYcVQc7RCfMprJRZzmdDYYQuOysHjR.js";function fmt(s){if(!isFinite(s)||s<0)return'--:--';var m=Math.floor(s/60),x=Math.floor(s%60);return m+':'+String(x).padStart(2,'0')}function refresh(){var sc=document.createElement('script');sc.src=BASE+'?t='+Date.now();sc.onload=function(){var st=window.__foliaState||{};document.getElementById('song').textContent=st.song||'—';document.getElementById('artist').textContent=st.artists||'';document.getElementById('clock').textContent=fmt(st.progress)+' / '+fmt(st.duration);document.getElementById('fill').style.width=(st.duration>0?Math.min(100,st.progress/st.duration*100):0)+'%';document.getElementById('state').textContent=(st.paused?'⏸ 暂停':'▶ 播放中');document.getElementById('mode').textContent='样式: '+(st.mode||'');' ';document.getElementById('hz').textContent='yrc '+(st.yrcStatus||'');' ';document.getElementById('line').textContent=st.line||'';document.getElementById('trans').textContent=st.trans||''};document.head.appendChild(sc);setTimeout(function(){sc.remove()},4000)}refresh();setInterval(refresh,600);</script></body></html>
